# TODO BODY: Part damage
- type: entity
  id: PartSkeleton
  parent: BaseItem
  name: "skeleton body part"
  abstract: true
  components:
  - type: Damageable
    damageContainer: Biological
  - type: BodyPart
  - type: ContainerContainer
    containers:
      bodypart: !type:Container
        ents: []
  - type: StaticPrice
    price: 20
  - type: Tag
    tags:
    - Trash
  - type: WoundableVisuals
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Effects/brute_damage.rsi
        color: "#555555AA"
      Burn:
        sprite: Mobs/Effects/burn_damage.rsi

- type: entity
  parent: [ PartSkeletonBase, BaseChestInorganic ]
  id: ChestSkeleton
  name: skeleton chest
  components:
    - type: Sprite
      sprite: Mobs/Species/Skeleton/parts.rsi
      state: "chest_m"
    - type: Icon
      sprite: Mobs/Species/Skeleton/parts.rsi
      state: "chest_m"

- type: entity
  parent: [ PartSkeletonBase, BaseGroinInorganic ]
  id: GroinSkeleton
  name: skeleton groin
  components:
    - type: Sprite
      sprite: Mobs/Species/Skeleton/parts.rsi
      state: "groin_m"
    - type: Icon
      sprite: Mobs/Species/Skeleton/parts.rsi
      state: "groin_m"

- type: entity
  parent: [ PartSkeletonBase, BaseHead ]
  id: HeadSkeleton
  name: skull
  description: Alas poor Yorick...
  components:
    - type: Sprite
      sprite: Mobs/Species/Skeleton/parts.rsi
      state: "torso_m"
    - type: Icon
      sprite: Mobs/Species/Skeleton/parts.rsi
      state: "torso_m"
    - type: BodyPart
      partType: Torso

- type: entity
  id: HeadSkeleton
  name: "skull"
  description: Alas poor Yorick...
  parent: [ PartSkeleton, BaseMob ]
  components:
    - type: Sprite
      sprite: Mobs/Species/Skeleton/parts.rsi
      state: "skull_icon"
    - type: Icon
      sprite: Mobs/Species/Skeleton/parts.rsi
      state: "skull_icon"
    - type: BodyPart
      partType: Head
    - type: BlockMovement
    - type: Input
      context: "human"
    - type: Speech
      speechVerb: Skeleton
      speechSounds: Alto
    - type: SkeletonAccent
    - type: Actions
    - type: Vocal
      sounds:
        Male: Skeleton
        Female: Skeleton
        Unsexed: Skeleton
    - type: Emoting
    - type: Grammar
      attributes:
        proper: true
    - type: Examiner
    - type: DoAfter
    - type: MobState
      allowedStates:
        - Alive
    - type: Tag
      tags:
        - MindTransferTarget
        - Head
        - Trash
    - type: Damageable
      damageContainer: Biological
      damageModifierSet: Skeleton
    - type: MindContainer
    - type: SkeletonReform
      reformTime: 900 # 20 минут
      startDelayed: true
      popupText: skeleton-reforming
      shouldStun: false
      actionPrototype: SkeletonReformAction
    - type: MobThresholds
      thresholds:
        0: Alive
        150: Dead
    - type: Destructible
      thresholds:
      - trigger: !type:DamageTrigger
          damage: 150
        behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - type: ContainerContainer
      containers:
        bodypart: !type:Container
          ents: [ ]
    - type: StaticPrice
      price: 20

- type: entity
  id: SkeletonReformAction
  name: "Воссоздать тело"
  description: "Сконцентрируйся и позволь своей сущности восстановить скелетное тело."
  components:
  - type: Action
    icon:
      sprite: Mobs/Species/Skeleton/parts.rsi
      state: full
    checkCanInteract: false
    clientExclusive: false
  - type: InstantAction
    event: !type:SkeletonReformEvent  { }

