- type: entity
  id: ActionJumpboots
  name: action-jump
  description: action-jump-desc
  categories: [ HideSpawnMenu ]
  components:
  - type: WorldTargetAction
    icon: { sprite: ADT/Clothing/Shoes/Boots/jumpboots.rsi, state: icon }
  - type: InstantAction
    event: !type:JumpbootsActionEvent
    useDelay: 10
    range: 16
    itemIconStyle: BigAction
    checkCanAccess: false
    repeat: true


- type: entity
  id: ActionJumpbootsSynd
  name: action-jump
  description: action-jump-desc
  categories: [ HideSpawnMenu ]
  components:
  - type: WorldTargetAction
    icon: { sprite: DT/Clothing/Shoes/Boots/jumpboots_syndie.rsi, state: icon }
  - type: InstantAction
    event: !type:JumpbootsActionEvent
    useDelay: 15
    range: 16
    itemIconStyle: BigAction
    checkCanAccess: false
    repeat: true
