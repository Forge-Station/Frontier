# Translator that doesn't need power to work.
- type: entity
  categories: [ HideSpawnMenu ]
  id: TranslatorUnpowered
  parent: BaseItem
  name: translator
  description: Translates speech.
  components:
  - type: Sprite
    sprite: _EE/Objects/Devices/translator.rsi
    state: icon
    layers:
      - state: icon
      - state: translator
        shader: unshaded
        # visible: false
        map: [ "enum.ToggleableVisuals.Enabled", "enum.PowerDeviceVisualLayers.Powered" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: HandheldTranslator
    enabled: false
  - type: Clothing # To allow equipping translators on the neck slot.
    slots: [neck]
    equipDelay: 0.3
    unequipDelay: 0.3
    quickEquip: false # Would conflict

# Base translator that uses a power cell. Starts with an empty slot.
- type: entity
  categories: [ HideSpawnMenu ]
  id: TranslatorPoweredBase
  parent: [ TranslatorUnpowered, PowerCellSlotSmallItem ] # Forge-change: PowerCellSlotSmallItem<PowerCellSlotMediumItem
  components:
  - type: ItemToggle
  - type: PowerCellDraw
    drawRate: 1
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default

# Normal translator with medium power cell in it.
- type: entity
  categories: [ HideSpawnMenu ]
  id: Translator
  parent: [ PowerCellSlotSmallItem, TranslatorPoweredBase ]
  suffix: Powered

# Normal translator with a high power cell and special appearance.
- type: entity
  categories: [ HideSpawnMenu ]
  id: TranslatorForeigner
  parent: [ PowerCellSlotHighItem, TranslatorPoweredBase ]
  name: foreigner's translator
  description: A special-issue translator that helps foreigner's speak and understand this station's primary language.


