- type: entity
  name: hand fax machine
  parent: BaseHandheldComputer
  id: HandheldFax
  description: Portable fax machine that runs on a power cell.
  components:
  - type: Sprite
    sprite: Forge/Objects/Tools/handfax.rsi
    drawdepth: SmallObjects
    layers:
    - state: icon
      scale: 0.7, 0.7
      map: [ "enum.FaxMachineVisuals.VisualState" ]
  - type: Icon
    sprite: Forge/Objects/Tools/handfax.rsi
    state: icon
    scale: 0.7, 0.7
  - type: Clothing
    sprite: Forge/Objects/Tools/handfax.rsi
    slots:
    - gloves
  - type: Appearance
  - type: ActivatableUI
    key: enum.FaxUiKey.Key
  - type: UserInterface
    interfaces:
      enum.FaxUiKey.Key:
        type: FaxBoundUi
  - type: Faxecute
    damage:
      types:
        Blunt: 100
  - type: FaxMachine
    paperSlot:
      insertSound: /Audio/Machines/scanning.ogg
      ejectSound: /Audio/Machines/tray_eject.ogg
      whitelist:
        components:
          - FaxableObject #used to be PaperComponent - brainfood1183
      blacklist:
        components:
          - CargoSlip
  - type: GenericVisualizer
    visuals:
      enum.PowerCellSlotVisuals.Enabled:
        enum.FaxMachineVisuals.VisualState:
          True: { state: idle }
          False: { state: icon }
      enum.FaxMachineVisuals.VisualState:
        enum.FaxMachineVisuals.VisualState:
          Printing: { state: printing }
          Normal: {state: idle}
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellSmall
  - type: ContainerContainer
    containers:
      Paper: !type:ContainerSlot
      cell_slot: !type:ContainerSlot {}
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: Fax
    transmitFrequencyId: Fax
  - type: Item
    size: Normal
  - type: PowerCellDraw
    drawRate: 1.5
  - type: ToggleCellDraw
  - type: StaticPrice
    price: 5000
