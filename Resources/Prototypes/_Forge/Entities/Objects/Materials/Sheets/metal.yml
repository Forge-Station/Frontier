# region Magmite
- type: entity
  parent: SheetOtherBase
  id: SheetMagmite
  name: magmite
  suffix: Full
  components:
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      Magmite: 100
  - type: Stack
    stackType: Magmite
    baseLayer: base
    layerStates:
    - magmite
