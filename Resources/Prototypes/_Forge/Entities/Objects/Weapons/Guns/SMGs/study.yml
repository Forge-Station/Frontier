- type: entity
  name: Study
  parent: NFBaseWeaponFrameSubMachineGunNanotrasen
  id: WeaponSubMachineGunStudy
  description: For studying.
  components:
  - type: Sprite
    sprite: Forge/Objects/Weapons/Guns/Rifles/scar12.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
  - type: Tag
    tags:
    - Sidearm
  - type: Gun
    fireRate: 8
    projectileSpeed: 20
    soundGunshot:
      path: /Audio/_NF/Weapons/Guns/Gunshots/rifle.ogg
  - type: ChamberMagazineAmmoProvider
    autoEject: true
  - type: Appearance
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: NFMagazineRifle30
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - NFMagazineRifle30
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: NFCartridgeRifle30
        priority: 1
        whitelist:
          tags:
            - NFCartridgeRifle30
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        showEnts: False
        occludes: True
        ents: []
      gun_magazine: !type:ContainerSlot
        showEnts: False
        occludes: True
        ent: null
      gun_chamber: !type:ContainerSlot
        showEnts: False
        occludes: True
        ent: null
