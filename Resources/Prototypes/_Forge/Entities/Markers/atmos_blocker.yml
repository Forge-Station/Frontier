- type: entity
  name: Atmos Fix Oxygen Marker
  id: AtmosFixOxygenMarkerLow
  description: "Oxygen @ gas miner pressure, T20C"
  parent: MarkerBase
  components:
    - type: Sprite
      layers:
        - sprite: Markers/atmos.rsi # {
          state: base
          shader: unshaded
        - sprite: Markers/atmos.rsi
          shader: unshaded # }
          state: oxygen
    - type: AtmosFixMarker
      mode: 2

