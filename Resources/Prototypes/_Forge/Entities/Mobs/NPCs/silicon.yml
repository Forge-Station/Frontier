  parent: MobSiliconBase
  name: Beery
  description: Brass-plated smiley waiter bot.
  components:
  - type: Reactive
    groups:
      Acidic: [Touch]
  - type: Damageable
    damageContainer: Inorganic
  - type: Sprite
    sprite: Forge/Mobs/Silicon/Beery.rsi
    state: beery
  - type: MovedByPressure
  - type: Physics
  - type: Advertise
    pack: scraptechshumanoidchatter
    bodyType: KinematicController
  - type: StatusEffects
    allowed:
    - Stutter
    - Electrocution
