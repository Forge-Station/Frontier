# region Projectile
# 40mm
- type: entity
  id: DeslerBullet
  name: 40mm
  parent: 20mmBulletBase
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Structural: 3
        Piercing: 7
  - type: Sprite
    sprite: _Mono/Objects/SpaceArtillery/50_armorpiercing_machinegun_casing.rsi
    layers:
    - state: base-projectile
  - type: PointLight
    color: orange

- type: entity
  id: DeslerSpread
  categories: [ HideSpawnMenu ]
  parent: DeslerBullet
  components:
  - type: ProjectileSpread
    proto: DeslerBullet
    count: 7
    spread: 6

#40 mm cumul
- type: entity
  id: DeslerExplBullet
  name: 40mm cumul
  parent: 20mmBulletBase
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Structural: 3
        Piercing: 7
  - type: Sprite
    sprite: _Mono/Objects/SpaceArtillery/50_armorpiercing_machinegun_casing.rsi
    layers:
    - state: base-projectile
  - type: PointLight
    color: orange

- type: entity
  id: DeslerExplSpread
  categories: [ HideSpawnMenu ]
  parent: DeslerExplBullet
  components:
  - type: ProjectileSpread
    proto: DeslerExplBullet
    count: 7
    spread: 6
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: DefaultShipGun
    totalIntensity: 1
    intensitySlope: 5
    maxIntensity: 25
    maxTileBreak: 1

# region Hitscan
- type: entity
  parent: BasicHitscan
  id: PhaserStormLaser
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: muzzle_beam_heavy
    travelFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: beam_heavy
    impactFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: impact_beam_heavy
  - type: HitscanRadarSignature
    radarColor: red
  - type: HitscanBasicDamage
    damage:
     types:
      Heat: 25
      Structural: 10
  - type: HitscanBasicRaycast
    maxDistance: 200

# region Forge rebalance
# rebalance Monolith kinetic projectiles

# BulletBase - "stock"/standart - обычный
# APHE - бронебойный, взрывчатка
# APCBC - повыш. бронебойный, без взрыва

# 20mm
- type: entity
  id: Forge20mmBulletBase
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Structural: 80
        Blunt: 14
        Piercing: 28
    ignoreWeaponGrid: true
  - type: ShipWeaponProjectile
  - type: TimedDespawn
    lifetime: 2
  - type: PointLight
    radius: 3.5
    energy: 0.5
  - type: RadarBlip
    scale: 0.85
    requireNoGrid: true
    shape: triangle
    radarColor: "#1df1f5"

- type: entity
  id: Forge20mmBulletAPHE
  name: 20mm AP bullet
  parent: Forge20mmBulletBase
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Structural: 95
        Blunt: 20
        Piercing: 32
  - type: Sprite
    sprite: _Mono/Objects/SpaceArtillery/50_armorpiercing_machinegun_casing.rsi
    layers:
    - state: base-projectile
  - type: PointLight
    color: orange
  - type: TriggerOnCollide
    fixtureID: projectile
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: DefaultShipGun
    totalIntensity: 20
    intensitySlope: 15
    maxIntensity: 25
    maxTileBreak: 1

- type: entity
  id: Forge20mmBulletAPCBC
  name: 20mm bullet
  parent: Forge20mmBulletBase
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Structural: 120
        Blunt: 34
        Piercing: 46

