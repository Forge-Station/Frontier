# adder, but bad adder
- type: entity
  id: WeaponTurretDeslerScattergun
  name: ship scatter Desler 40mm
  parent: BallisticArtilleryMagazine
  description: Twin-barrelled scatter cannon, firing bursts of canister shot to shred any incoming missiles or potential boarders.
  components:
  - type: StaticPrice
    price: 250
  - type: Sprite
    sprite: Forge/Objects/ShuttleWeapons/adler.rsi
    layers:
    - state: space_artillery
  - type: Appearance
  - type: FireControlRotate
  - type: AutoShootGun
  - type: GunSignalControl
  - type: WirelessNetworkConnection
    range: 700
#  - type: DeviceLinkSink
#    ports:
#    - Toggle
  - type: Gun
    fireRate: 6
    projectileSpeed: 200
    minAngle: 0
    maxAngle: 9
    shootThermalSignature: 10000 # relatively low for a shipgun, ~693m signature if firing continuously
    soundGunshot:
      path: /Audio/_Mono/Weapons/Guns/Gunshots/slammer.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: SpaceArtillery
    powerChargeRate: 100
    powerUsePassive: 100
  - type: Actions
  - type: CombatMode
    isInCombatMode: true
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine40mm
        insertSound: /Audio/Weapons/Guns/MagIn/hpistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/sfrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - Magazine40mm
        whitelistFailPopup: gun-magazine-whitelist-fail
  - type: Airtight
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 7500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: RadiationBlocker
    resistance: 8
  - type: RadarBlip
    radarColor: "#FF0000"
    scale: 1
  - type: ShipGunType
    shipType: Ballistic
  - type: ShipGunClass
    shipClass: Light

# reskin Phalanx L-1 to Phaser AAM "Storm"
# + another hitscan proto
- type: entity
  id: WeaponLaserTurretAAMStorm
  name: phaser AAM Storm
  parent: WeaponLaserTurretL1Phalanx
  description: A light laser gun.
  components:
  - type: Battery
    maxCharge: 5000 # Forge-change: rebalance
    startingCharge: 5000 # Forge-change: rebalance
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 10 # Forge-change: rebalance
  - type: HitscanBatteryAmmoProvider
    proto: PhaserStormLaser
    fireCost: 25
  - type: Sprite
    sprite:  Forge/Objects/ShuttleWeapons/desler.rsi
    layers:
    - state: desler-base
    - state: desler-shaded
      shader: unshaded
