- type: pointOfInterest
  id: OldFrontierTavern
  name: 'Таверна Старый Фронтир'
  minimumDistance: 12500
  maximumDistance: 15000
  spawnGroup: Required
  gridPath: /Maps/_Forge/POI/oldfrontier.yml
  addComponents:
  - type: Shuttle
  - type: IFF
    color: "#BA55D3"
  - type: ProtectedGrid
    preventArtifactTriggers: True
    preventExplosions: True
    preventEmpEvents: True
    preventRCDUse: True
    killHostileMobs: False

- type: gameMap
  id: OldFrontierTavern
  mapName: 'Таверна Старый Фронтир'
  mapPath: /Maps/_Forge/POI/oldfrontier.yml
  minPlayers: 0
  stations:
    OldFrontierTavern:
      stationProto: RecordsFrontierOutpost
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Таверна Старый Фронтир'
        - type: StationJobs
          availableJobs: {}
        - type: StationDeadDropHintExempt


