- type: entity
  id: Trademachine
  name: Консоль MercHunter™
  description: Консоль, предоставляющая доступ к обширной сети заказчиков MercHunter (Торговая марка).
  suffix: Mercenary
  components:
  - type: NcStore
    buyPresets:
      - mercenary_buy
    sellPresets:
      - mercenary_sell
    contractPresets:
      - mercenary_contract
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: NcStoreStructuredBoundUi
  - type: ActivatableUI
    key: enum.StoreUiKey.Key
  - type: Clickable
  - type: InteractionOutline
  - type: Transform
    anchored: true
    noRot: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        density: 300
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Sprite
    sprite: Forge/merchunted.rsi
    layers:
    - state: "base"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "on"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
  - type: PointLight
    radius: 2.5
    energy: 1
    color: "#b34747"
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true

- type: storePresetStructured
  id: mercenary_buy
  currency: MercenaryToken
  catalog:
      # От дешёвого к дорогому
      Оружие:
      # Лазерное (Дополнительное - Основное)
      - proto: NFWeaponEnergyPistolLaserAntique
        price: 22
      - proto: NFWeaponEnergySubMachineGunDeltaV
        price: 11
      # Баллистик (Дополнительное - Основное)
      - proto: NFWeaponRevolverArgenti
        price: 4
      - proto: NFWeaponRevolverLucky
        price: 6
      - proto: WeaponPistolMoonWhisper
        price: 14
      - proto: NFWeaponSubMachineGunTypewriter
        price: 7
      Броня:
      - proto: ClothingOuterArmorHeavyGreen
        price: 13
      - proto: ClothingOuterArmorRiot
        price: 14
      Скафандры:
      - proto: ClothingOuterHardsuitTacticalMaid
        price: 10
      - proto: ClothingOuterHardsuitScaf
        price: 20
      - proto: ClothingOuterHardsuitMercenaryElite
        price: 40
      Разное:
      - proto: ResearchDisk5000
        price: 10
      Обменник:
      - proto: SpaceCash1000
        price: 8

- type: storePresetStructured
  id: mercenary_sell
  currency: MercenaryToken
  catalog:
      Оружие:
      - proto: TelecrystalDamaged1
        price: 1
