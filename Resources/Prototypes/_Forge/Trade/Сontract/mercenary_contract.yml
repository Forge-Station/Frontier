- type: storeContractsPreset
  id: mercenary_contract
  contracts:
  - mercenary_contract_collection
  - mercenary_contract_randomstaff

# region Easy
- type: storeContract
  id: mercenary_contract_collection
  name: Коллекционер
  description: "Требуются следующие вещи для пополнения коллекции..."
  targetCount: { min: 1, max: 2 }
  bonusPickCount: { min: 1, max: 5 }
  difficulty: Easy
  targets:
# Watch
  - id: WristwatchGold
    required: { min: 1, max: 1 }
    weight: 5
  - id: Wristwatch
    required: { min: 1, max: 2 }
    weight: 5
# Treasure
  - id: TreasureFlopDiskDrive
    required: { min: 1, max: 5 }
    weight: 5
  - id: TreasureCDDrive
    required: { min: 1, max: 5 }
    weight: 5
  - id: TreasureHardDiskDrive
    required: { min: 1, max: 5 }
    weight: 5
  - id: TreasureHardDiskDrive
    required: { min: 1, max: 5 }
    weight: 5
  - id: TreasureDatadiskEncrypted
    required: { min: 1, max: 5 }
    weight: 5
  - id: TreasureCPUSupercharged
    required: { min: 1, max: 3 }
    weight: 5
  - id: TreasureSampleTube
    required: { min: 1, max: 5 }
    weight: 5
  currencies:
  - id: MercenaryToken
    min: 1
    max: 3
  - id: Credit
    min: 0
    max: 5000

- type: storeContract
