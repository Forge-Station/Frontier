  - id: ScrapFireExtinguisher
    required: { min: 1, max: 1 }
    weight: 5
  - id: SaxophoneInstrument
    required: { min: 1, max: 1 }
    weight: 5
  - id: CelloInstrument
    required: { min: 1, max: 1 }
