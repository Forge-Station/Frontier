- type: trait
  id: BaseCPR
  name: trait-crp-name
  description: trait-crp-desc
  category: Skills
  cost: 1
  mutuallyExclusiveTraits:
  - AdvancedCPR
  components:
  - type: CPRTraining
    cPRHealing:
      types:
        Asphyxiation: -5
        Blunt: 1

- type: trait
  id: AdvancedCPR
  name: trait-advcrp-name
  description: trait-advcrp-desc
  category: Skills
  cost: 2
  mutuallyExclusiveTraits:
  - BaseCPR
  components:
  - type: CPRTraining
    doAfterDuration: 3
    cPRHealing:
      types:
        Asphyxiation: -6
    resuscitationChance: 0.1

