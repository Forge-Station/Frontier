# Главная точка входа для космических НПС
- type: htnCompound
  id: SpaceHostileCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:TargetExistOperator
            targetKey: Target

        - !type:HTNCompoundTask
          task: SpaceGunCombatCompound

    - tasks:
        - !type:HTNCompoundTask
          task: SimpleHostileCompound

- type: htnCompound
  id: SpaceGunCombatCompound
  branches:
    - preconditions:
        - !type:ActiveHandComponentPrecondition
          components:
            - type: Gun
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:GunOperator
            targetKey: Target
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:WaitOperator
            key: IdleTime
          preconditions:
            - !type:KeyExistsPrecondition
              key: IdleTime
